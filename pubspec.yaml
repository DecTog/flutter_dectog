name: flutter_adto
description: AdTo for Flutter apps. Deep links that open the app, deferred deep links that
  survive the install, and install attribution.

version: 1.0.0

homepage: https://adto.app
repository: https://github.com/ad-to/flutter_adto
issue_tracker: https://github.com/ad-to/flutter_adto/issues
documentation: https://docs.adto.app

environment:
  sdk: ">=3.7.0 <4.0.0"
  flutter: ">=3.29.0"

# Ranges are deliberately wide so the SDK drops into apps that already pin
# these packages: each floor is the release that introduced the API the SDK
# calls (not the newest), each ceiling the next major.
dependencies:
  crypto: ">=3.0.0 <4.0.0"
  # 6.0.0: uriLinkStream + getInitialLink(); 7.x is API-compatible (Flutter ≥ 3.38).
  app_links: ">=6.0.0 <8.0.0"
  # 6.0.1: checkConnectivity() returns a List<ConnectivityResult>.
  connectivity_plus: ">=6.0.1 <8.0.0"
  # 11.2.0: IosDeviceInfo.modelName (marketing name).
  device_info_plus: ">=11.2.0 <14.0.0"
  flutter:
    sdk: flutter
  http: ">=1.0.0 <2.0.0"
  # 8.3.0: installerStore, installTime, updateTime, buildSignature.
  package_info_plus: ">=8.3.0 <11.0.0"
  path_provider: ">=2.0.0 <3.0.0"
  rxdart: ">=0.27.0 <0.29.0"

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

# The platform channel is implemented natively (device id, carrier, the
# install-referrer readers, backup-excluded storage, pasteboard, launch
# intent and the UIPasteControl view). It reads no advertising identifiers:
# no AdSupport / AppTrackingTransparency on iOS, no Play services ads on Android.
flutter:
  plugin:
    platforms:
      android:
        package: app.adto.flutter_adto
        pluginClass: AdtoIdentifiersPlugin
      ios:
        pluginClass: AdtoIdentifiersPlugin
