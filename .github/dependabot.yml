# Weekly dependency updates for the package, the companion package,
# the example app, the Android plugin's Gradle dependencies and the actions.
version: 2
updates:
  - package-ecosystem: pub
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: pub
    directory: /packages/flutter_adto_adid
    schedule:
      interval: weekly
  - package-ecosystem: pub
    directory: /example
    schedule:
      interval: weekly
  - package-ecosystem: gradle
    directory: /android
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
