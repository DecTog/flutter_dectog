name: flutter_dectog_adid
description: The advertising identifier (IDFA after App Tracking Transparency,
  GAID) for flutter_dectog, kept out of the core SDK.

version: 1.0.0

homepage: https://dectog.com
repository: https://github.com/DecTog/flutter_dectog/tree/main/packages/flutter_dectog_adid
issue_tracker: https://github.com/DecTog/flutter_dectog/issues
documentation: https://docs.dectog.com/sdk/device-data-and-privacy/

environment:
  sdk: ">=3.7.0 <4.0.0"
  flutter: ">=3.29.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_dectog: ^1.0.0

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

# The only package that links AdSupport and AppTrackingTransparency
# (iOS) and Play services ads-identifier with the AD_ID permission (Android).
# An app that does not depend on it ships none of them.
flutter:
  plugin:
    platforms:
      android:
        package: app.dectog.flutter_dectog_adid
        pluginClass: DectogAdIdPlugin
      ios:
        pluginClass: DectogAdIdPlugin
