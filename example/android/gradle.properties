org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
# Kept deliberately: third-party plugins used by the
# example (device_info_plus, package_info_plus) still apply the Kotlin
# Gradle plugin themselves, so Flutter's migrator re-adds this opt-out pin
# until they migrate. Our own plugins no longer apply KGP either way (2.8.0
# dropped play_install_referrer — the referrer reader is native now). Remove
# this pin once those plugins ship Built-in Kotlin support.
android.builtInKotlin=false
# The plugin's JVM tests (Robolectric, test-only) pull Bouncy Castle, whose
# multi-release jar carries Java 25 classes Jetifier cannot read. It needs no
# jetifying (no support-library references), so skip it.
android.jetifier.ignorelist=bcprov-jdk18on
